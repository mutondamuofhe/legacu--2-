services:
  - type: web
    name: legacy-vault
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./legacu/LegacyVault/Dockerfile
    dockerContext: ./legacu/LegacyVault
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: ConnectionStrings__DefaultConnection
        value: "Data Source=/tmp/legacyvault.db;Cache=Shared"
      - key: DataProtection__KeysPath
        value: /tmp/legacyvault-keys
      - key: VaultStorage__EphemeralDemo
        value: "true"
      - key: Admin__Email
        sync: false
      - key: Admin__Password
        sync: false
